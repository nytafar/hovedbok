name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hovedbok
          POSTGRES_PASSWORD: hovedbok
          POSTGRES_DB: hovedbok
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hovedbok -d hovedbok"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://hovedbok:hovedbok@localhost:5432/hovedbok
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      # xmllint validates the SAF-T export against Skatteetaten's XSD (test/saft.test.ts)
      - run: sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: bun install --frozen-lockfile
      - run: bun run migrate
      - run: bun run check
